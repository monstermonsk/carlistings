openapi: 3.1.0
info:
  title: Crankshaft Listing Tuner internal API
  version: 0.3.0-proposed
  description: >-
    Proposed canonical contract. WP-00 maps these paths to the existing
    Crankshaft website/auth/verifier stack before implementation.
servers:
  - url: https://internal.example.invalid
security:
  - bearerAuth: []
paths:
  /v1/capture-batches:
    post:
      operationId: createCaptureBatch
      summary: Create a dealer-scoped media upload batch
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tenant_id, stock_lifecycle_id, expected_stock_revision, rights_receipt_id, files]
              properties:
                tenant_id: { type: string }
                stock_lifecycle_id: { type: string }
                expected_stock_revision: { type: string }
                rights_receipt_id: { type: string }
                files:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    additionalProperties: false
                    required: [client_file_id, kind, content_type, byte_size, sha256]
                    properties:
                      client_file_id: { type: string }
                      kind: { type: string, enum: [photo, video] }
                      content_type: { type: string }
                      byte_size: { type: integer, minimum: 1 }
                      sha256: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
      responses:
        '201':
          description: Batch and expiring direct-upload targets created
          content:
            application/json:
              schema:
                type: object
                required: [batch_id, upload_targets]
                properties:
                  batch_id: { type: string }
                  upload_targets:
                    type: array
                    items:
                      type: object
                      required: [client_file_id, url, expires_at]
                      properties:
                        client_file_id: { type: string }
                        url: { type: string, format: uri }
                        expires_at: { type: string, format: date-time }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/capture-batches/{batch_id}/complete:
    post:
      operationId: completeCaptureBatch
      summary: Verify uploaded hashes and enqueue analysis once
      parameters:
        - $ref: '#/components/parameters/BatchId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Accepted after durable verification/event write
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobReceipt'
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/stocks/{stock_lifecycle_id}/workbench:
    get:
      operationId: getStockWorkbench
      summary: Current source revision, facts, media QA and listing state
      parameters:
        - $ref: '#/components/parameters/StockLifecycleId'
      responses:
        '200':
          description: Dealer/operator-scoped review state
          content:
            application/json:
              schema:
                type: object
                required: [stock_lifecycle_id, source_revision, state, facts, media, listing_versions]
                properties:
                  stock_lifecycle_id: { type: string }
                  source_revision: { type: string }
                  state: { type: string }
                  facts: { type: array, items: { type: object } }
                  media: { type: array, items: { type: object } }
                  listing_versions: { type: array, items: { type: object } }
  /v1/stocks/{stock_lifecycle_id}/drafts:
    post:
      operationId: createListingDraft
      summary: Snapshot source and enqueue candidate generation
      parameters:
        - $ref: '#/components/parameters/StockLifecycleId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_stock_revision, destinations]
              properties:
                expected_stock_revision: { type: string }
                destinations: { type: array, minItems: 1, items: { type: string } }
      responses:
        '202':
          description: Draft job queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobReceipt' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/jobs/{job_id}:
    get:
      operationId: getJob
      summary: Job state and actionable reason codes
      parameters:
        - in: path
          name: job_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Current durable job state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobReceipt' }
  /v1/listing-versions/{version_id}/approve:
    post:
      operationId: approveListingVersion
      summary: Bind named dealer approval to content hash and source revision
      parameters:
        - $ref: '#/components/parameters/VersionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content_sha256, expected_stock_revision, destinations]
              properties:
                content_sha256: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
                expected_stock_revision: { type: string }
                destinations: { type: array, minItems: 1, items: { type: string } }
      responses:
        '200':
          description: Approved immutable version
          content:
            application/json:
              schema:
                type: object
                required: [approval_id, approved_at, content_sha256]
                properties:
                  approval_id: { type: string }
                  approved_at: { type: string, format: date-time }
                  content_sha256: { type: string }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/listing-versions/{version_id}/publish:
    post:
      operationId: publishListingVersion
      summary: Enqueue authorized idempotent destination writes
      parameters:
        - $ref: '#/components/parameters/VersionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [approval_id]
              properties:
                approval_id: { type: string }
      responses:
        '202':
          description: Publish jobs queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobReceipt' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/listing-versions/{version_id}/publications:
    get:
      operationId: listPublications
      summary: Provider receipts and live readback differences
      parameters:
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200':
          description: Per-destination publication state
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [destination, state]
                  properties:
                    destination: { type: string }
                    route_mode: { type: string, enum: [api, feed, browser_auto, browser_assist, dealer_task, csv] }
                    state: { type: string, enum: [queued, preparing, awaiting_site_session, awaiting_human, submitted, accepted, live, live_unverified, ui_changed, mismatch, failed, exported, withdrawal_pending, withdrawn] }
                    external_id: { type: [string, 'null'] }
                    live_url: { type: [string, 'null'], format: uri }
                    diff_codes: { type: array, items: { type: string } }
  /v1/publication-jobs/{publication_job_id}:
    get:
      operationId: getPublicationJob
      summary: Read API/feed/browser job phase, checkpoint and redacted evidence
      parameters:
        - in: path
          name: publication_job_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Tenant-scoped publication job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicationJob' }
  /v1/publication-jobs/{publication_job_id}/resume:
    post:
      operationId: resumePublicationJob
      summary: Resume a paused browser/dealer checkpoint without duplicate submission
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - in: path
          name: publication_job_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [checkpoint_id, action, expected_listing_version_hash]
              properties:
                checkpoint_id: { type: string }
                action: { type: string, enum: [confirmed, canceled, retry_after_review] }
                expected_listing_version_hash: { type: string }
      responses:
        '202':
          description: Resume accepted after state/hash checks
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicationJob' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/integrations/verifier/events:
    post:
      operationId: ingestExistingVerifierEvent
      summary: Ingest signed event without blocking live call handling
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - in: header
          name: X-Crankshaft-Signature
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Must validate against event-envelope.schema.json; call payload against call-feedback.schema.json where applicable.
      responses:
        '202':
          description: Event durably accepted or already received
          content:
            application/json:
              schema:
                type: object
                required: [event_id, accepted]
                properties:
                  event_id: { type: string }
                  accepted: { type: boolean }
  /v1/dealer/staff:
    get:
      operationId: listDealerStaff
      summary: List tenant and location scoped Crankshaft staff records
      parameters:
        - in: query
          name: location_id
          schema: { type: string }
      responses:
        '200':
          description: Active and historical staff, role filtered
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DealerStaff' } }
    post:
      operationId: createDealerStaff
      summary: Create a Crankshaft salesperson and routing target
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DealerStaffInput' }
      responses:
        '201':
          description: Stable staff ID created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DealerStaff' }
  /v1/dealer/staff/{staff_id}:
    patch:
      operationId: updateDealerStaff
      summary: Effective dated staff/routing update; never erase prior call assignments
      parameters:
        - in: path
          name: staff_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DealerStaffInput' }
      responses:
        '200':
          description: Updated staff record
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DealerStaff' }
  /v1/dealer/calls:
    get:
      operationId: listDealerCalls
      summary: Paginated received calls with assigned/answered salesperson
      parameters:
        - in: query
          name: location_id
          schema: { type: string }
        - in: query
          name: staff_id
          schema: { type: string }
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        '200':
          description: Role-filtered call page
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/CallLedgerRecord' } }
                  next_cursor: { type: [string, 'null'] }
  /v1/dealer/calls/{call_id}:
    get:
      operationId: getDealerCall
      summary: One received call and all transfer legs
      parameters:
        - in: path
          name: call_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Call detail, role scoped
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CallLedgerRecord' }
  /v1/dealer/calls/{call_id}/corrections:
    post:
      operationId: correctDealerCall
      summary: Append manager correction; retain original event and reason
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - in: path
          name: call_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [field, corrected_value, reason]
              properties:
                field: { type: string, enum: [answered_staff_id, disposition, requested_stock_lifecycle_id] }
                corrected_value: { type: string }
                reason: { type: string, minLength: 1 }
      responses:
        '201': { description: Audited correction accepted }
  /v1/connectors/catalog:
    get:
      operationId: getConnectorCatalog
      summary: Product/version capability manifests and access prerequisites
      responses:
        '200':
          description: Available and gated product adapters
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ConnectorManifest' } }
  /v1/connections:
    post:
      operationId: createProviderConnection
      summary: Create scoped connection; secret submitted through secure one-time vault handoff
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [provider, product, location_ids, auth_handoff_id]
              properties:
                provider: { type: string }
                product: { type: string }
                location_ids: { type: array, items: { type: string } }
                auth_handoff_id: { type: string, description: One-time secret/OAuth handoff reference, not the credential }
      responses:
        '201':
          description: Connection created, validation pending
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderConnection' }
  /v1/connection-auth-handoffs:
    post:
      operationId: createConnectionAuthHandoff
      summary: One-time direct vault handoff for vendor-issued token; never log or echo token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [provider, product, credential]
              properties:
                provider: { type: string }
                product: { type: string }
                credential: { type: string, writeOnly: true }
      responses:
        '201':
          description: One-time handoff reference only
          content:
            application/json:
              schema:
                type: object
                required: [auth_handoff_id, expires_at]
                properties:
                  auth_handoff_id: { type: string }
                  expires_at: { type: string, format: date-time }
  /v1/connections/{connection_id}/test:
    post:
      operationId: testProviderConnection
      summary: Validate tenant, scope and provider access without returning a secret
      parameters:
        - $ref: '#/components/parameters/ConnectionId'
      responses:
        '200':
          description: Capability and sample read test result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderConnection' }
  /v1/connections/{connection_id}/rotate:
    post:
      operationId: rotateProviderConnection
      summary: Replace key with a new one-time auth handoff
      parameters:
        - $ref: '#/components/parameters/ConnectionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [auth_handoff_id]
              properties:
                auth_handoff_id: { type: string }
      responses:
        '200':
          description: Rotation receipt, old secret revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderConnection' }
  /v1/connections/{connection_id}:
    delete:
      operationId: revokeProviderConnection
      summary: Disable jobs and revoke/delete secret reference
      parameters:
        - $ref: '#/components/parameters/ConnectionId'
      responses:
        '204': { description: Disabled and revocation queued }
  /v1/exports/listings:
    post:
      operationId: exportApprovedListings
      summary: Produce validated listing CSV and media manifest/ZIP
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [listing_version_ids, format_version]
              properties:
                listing_version_ids: { type: array, minItems: 1, items: { type: string } }
                format_version: { type: string, enum: [inventory-listings-v1] }
      responses:
        '202':
          description: Export job queued; not a live publication receipt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobReceipt' }
  /v1/exports/calls:
    post:
      operationId: exportDealerCalls
      summary: Generate role-scoped calls-v1 CSV, masked by policy
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to, format_version]
              properties:
                from: { type: string, format: date-time }
                to: { type: string, format: date-time }
                location_id: { type: [string, 'null'] }
                format_version: { type: string, enum: [calls-v1] }
      responses:
        '202':
          description: Export job queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobReceipt' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: { type: string, minLength: 1 }
    BatchId:
      in: path
      name: batch_id
      required: true
      schema: { type: string }
    StockLifecycleId:
      in: path
      name: stock_lifecycle_id
      required: true
      schema: { type: string }
    VersionId:
      in: path
      name: version_id
      required: true
      schema: { type: string }
    ConnectionId:
      in: path
      name: connection_id
      required: true
      schema: { type: string }
  responses:
    Conflict:
      description: Source revision, state or approval hash changed
      content:
        application/json:
          schema:
            type: object
            required: [code, message]
            properties:
              code: { type: string }
              message: { type: string }
  schemas:
    PublicationJob:
      type: object
      required: [publication_job_id, tenant_id, listing_version_id, destination, route_mode, state]
      properties:
        publication_job_id: { type: string }
        tenant_id: { type: string }
        listing_version_id: { type: string }
        destination: { type: string }
        route_mode: { type: string, enum: [api, feed, browser_auto, browser_assist, dealer_task, csv] }
        state: { type: string, enum: [queued, preparing, awaiting_site_session, awaiting_human, submitted, accepted, live, live_unverified, ui_changed, mismatch, failed, exported, withdrawal_pending, withdrawn] }
        checkpoint_id: { type: [string, 'null'] }
        external_id: { type: [string, 'null'] }
        live_url: { type: [string, 'null'], format: uri }
        evidence_refs: { type: array, items: { type: string }, description: Redacted receipt/screenshot references }
        reason_codes: { type: array, items: { type: string } }
    DealerStaffInput:
      type: object
      additionalProperties: false
      required: [display_name, location_ids, active, route_target, timezone]
      properties:
        display_name: { type: string, minLength: 1 }
        location_ids: { type: array, minItems: 1, items: { type: string } }
        active: { type: boolean }
        route_target: { type: string, description: Existing router destination reference }
        timezone: { type: string }
        crm_external_user_id: { type: [string, 'null'] }
        effective_at: { type: string, format: date-time }
    DealerStaff:
      allOf:
        - $ref: '#/components/schemas/DealerStaffInput'
        - type: object
          required: [staff_id, tenant_id]
          properties:
            staff_id: { type: string }
            tenant_id: { type: string }
    CallLedgerRecord:
      type: object
      required: [call_id, tenant_id, location_id, started_at, transfer_attempts]
      properties:
        call_id: { type: string }
        tenant_id: { type: string }
        location_id: { type: string }
        started_at: { type: string, format: date-time }
        ended_at: { type: [string, 'null'], format: date-time }
        qualification: { type: [string, 'null'] }
        requested_stock_lifecycle_id: { type: [string, 'null'] }
        answered_staff_id: { type: [string, 'null'] }
        disposition: { type: [string, 'null'] }
        crm_lead_id: { type: [string, 'null'] }
        caller_display: { type: [string, 'null'], description: Role-masked }
        transfer_attempts:
          type: array
          items:
            type: object
            required: [transfer_attempt_id, staff_id, status, started_at]
            properties:
              transfer_attempt_id: { type: string }
              staff_id: { type: string }
              signalwire_leg_id: { type: [string, 'null'] }
              status: { type: string, enum: [attempted, ringing, answered, no_answer, failed, voicemail] }
              started_at: { type: string, format: date-time }
              answered_at: { type: [string, 'null'], format: date-time }
    ConnectorManifest:
      type: object
      required: [provider, product, manifest_version, auth_kind, capabilities]
      properties:
        provider: { type: string }
        product: { type: string }
        manifest_version: { type: string }
        auth_kind: { type: string, enum: [oauth, api_key, partner_grant, delegated_site_session, sftp, csv] }
        supported_route_modes:
          type: array
          items: { type: string, enum: [api, feed, browser_auto, browser_assist, dealer_task, csv] }
        permission_evidence_ref: { type: [string, 'null'] }
        permission_reviewed_at: { type: [string, 'null'], format: date-time }
        capabilities:
          type: object
          additionalProperties: { type: boolean }
    ProviderConnection:
      type: object
      required: [connection_id, provider, product, state]
      properties:
        connection_id: { type: string }
        provider: { type: string }
        product: { type: string }
        state: { type: string, enum: [pending_access, testing, active, degraded, revoked] }
        scopes: { type: array, items: { type: string } }
        last_tested_at: { type: [string, 'null'], format: date-time }
    JobReceipt:
      type: object
      required: [job_id, state]
      properties:
        job_id: { type: string }
        state: { type: string, enum: [queued, running, needs_input, succeeded, failed, canceled] }
        reason_codes: { type: array, items: { type: string } }
        artifact_ids: { type: array, items: { type: string } }
